<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa & Colchão</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffbe80;
            color: #333;
            text-align: center;
        }

        /* LOGO */
        header {
            padding: 30px;
        }

        header img {
            max-width: 380px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .container {
            background: #fff;
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 0 18px rgba(0,0,0,0.15);
        }

        h2 {
            color: #ff7a00;
            font-size: 28px;
        }

        p {
            font-size: 18px;
        }

        /* Instagram QR */
        .instagram-section img {
            width: 170px;
            height: 170px;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background: #25d366;
            color: white;
            padding: 18px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0,0,0,0.35);
            z-index: 999;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #ff8c2b;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <img src="logo-casa-e-colchao.png" alt="">
</header>

<div class="container">

    <h2>📍 Endereço</h2>
    <p><strong>Seme Simão, 1980</strong><br>
    Dentro do Posto Ipiranga — Uberlândia, MG</p>

    <h2>🛏️ Produtos</h2>
    <p>Colchões, camas box, travesseiros e diversos itens para seu conforto.</p>

    <h2>🗺️ Como chegar</h2>
    <iframe 
        src="https://www.google.com/maps?q=Seme+Simão,+1980,+Uberlândia&output=embed" 
        width="100%" height="320" 
        style="border:0; border-radius: 12px;" 
        allowfullscreen="" loading="lazy">
    </iframe>

    <h2 style="margin-top: 40px;">📸 Siga-nos no Instagram</h2>
    <p>@casaecolchao</p>

    <div class="instagram-section">
        <img src="qr_instagram.png" alt="">
    </div>

</div>

<a class="whatsapp-btn" href="https://wa.me/5534996701594" target="_blank">
    WhatsApp
</a>

<footer>
    © 2025 Casa & Colchão — Todos os direitos reservados.
</footer>

</body>
</html>
